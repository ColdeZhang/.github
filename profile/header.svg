<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Zhang Yuheng profile header</title>
  <desc id="desc">A system console themed banner describing Zhang Yuheng as a Data and Algorithm Engineer focused on machine learning, systems engineering, and research execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.38" stop-color="#0F2744"/>
      <stop offset="0.72" stop-color="#0F5132"/>
      <stop offset="1" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="glow" x1="200" y1="40" x2="1030" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CFEAFF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>

  <circle cx="985" cy="78" r="88" fill="#00D4FF" fill-opacity="0.18" filter="url(#soft)"/>
  <circle cx="1084" cy="242" r="104" fill="#FF8C00" fill-opacity="0.14" filter="url(#soft)"/>
  <path d="M740 54H1118C1131.25 54 1142 64.7452 1142 78V242C1142 255.255 1131.25 266 1118 266H740C726.745 266 716 255.255 716 242V78C716 64.7452 726.745 54 740 54Z" fill="#08131D" fill-opacity="0.48" stroke="#A7D8FF" stroke-opacity="0.18"/>
  <rect x="744" y="82" width="370" height="156" rx="14" fill="url(#glow)"/>

  <text x="68" y="88" fill="#9ED8FF" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="2.8">SYSTEM PROFILE // ONLINE</text>
  <text x="68" y="154" fill="#F4FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="1.2">ZHANG YUHENG</text>
  <text x="68" y="196" fill="#D5EAF8" font-family="Segoe UI, Arial, sans-serif" font-size="23">Data and Algorithm Engineer | Machine Learning | Systems Engineering</text>

  <text x="68" y="246" fill="#00D4FF" font-family="Consolas, 'Courier New', monospace" font-size="18">&gt; building practical AI systems with research depth and engineering discipline</text>

  <text x="760" y="110" fill="#7FDFFF" font-family="Consolas, 'Courier New', monospace" font-size="16">status</text>
  <text x="1038" y="110" fill="#F7C26B" font-family="Consolas, 'Courier New', monospace" font-size="16" text-anchor="end">ACTIVE</text>
  <rect x="760" y="128" width="322" height="10" rx="5" fill="#123247"/>
  <rect x="760" y="128" width="274" height="10" rx="5" fill="#00D4FF"/>

  <text x="760" y="170" fill="#CFEAFF" font-family="Consolas, 'Courier New', monospace" font-size="14">FOCUS_A</text>
  <text x="872" y="170" fill="#FFFFFF" font-family="Consolas, 'Courier New', monospace" font-size="14">ML systems</text>
  <text x="760" y="196" fill="#CFEAFF" font-family="Consolas, 'Courier New', monospace" font-size="14">FOCUS_B</text>
  <text x="872" y="196" fill="#FFFFFF" font-family="Consolas, 'Courier New', monospace" font-size="14">Time series forecasting</text>
  <text x="760" y="222" fill="#CFEAFF" font-family="Consolas, 'Courier New', monospace" font-size="14">FOCUS_C</text>
  <text x="872" y="222" fill="#FFFFFF" font-family="Consolas, 'Courier New', monospace" font-size="14">Computer vision + LLM extraction</text>

  <rect x="68" y="270" width="192" height="26" rx="13" fill="#0A1F2E" stroke="#00D4FF" stroke-opacity="0.45"/>
  <text x="164" y="288" fill="#D7F6FF" font-family="Consolas, 'Courier New', monospace" font-size="13" text-anchor="middle">Python | C++ | CUDA | Java</text>
